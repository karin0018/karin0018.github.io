---
layout: default
---
<div id="main" role="main">
  <article class="blog-content">
    <h1 class="page__title">{{ page.title }}</h1>
    {% if page.date %}<p class="page__meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</p>{% endif %}
    <section class="page__content">{{ content }}</section>
    {% if page.date %}<p class="blog-back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>{% endif %}
  </article>
</div>
